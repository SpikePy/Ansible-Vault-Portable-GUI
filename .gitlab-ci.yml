stages:
  - build

build:
  stage: build
  image: golang:1.23
  script:
    - go vet ./...
    - GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o dist/ansible-vault .
    - GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/ansible-vault.exe .
  artifacts:
    name: "ansible-vault-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    expire_in: 30 days
